name: Refactoroscope Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Install Refactoroscope
      run: |
        uv pip install refactoroscope

    - name: Run Refactoroscope Analysis
      run: |
        refactoroscope analyze . --export json,html --export-dir ./reports

    - name: Upload analysis reports
      uses: actions/upload-artifact@v4
      with:
        name: code-analysis-report
        path: ./reports/
        retention-days: 30