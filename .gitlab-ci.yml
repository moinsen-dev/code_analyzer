# GitLab CI/CD configuration for Code Insight Analyzer
# This file demonstrates how to integrate Code Insight Analyzer into your GitLab CI/CD pipeline

stages:
  - test
  - analyze
  - deploy

# Variables
variables:
  UV_VERSION: "0.2.25"
  PYTHON_VERSION: "3.13"

# Cache dependencies between jobs
cache:
  paths:
    - .uv/
    - uv.lock

# Install dependencies
before_script:
  - curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
  - source "$HOME/.local/bin/env"
  - uv python install $PYTHON_VERSION
  - uv sync

# Test job
test:
  stage: test
  image: python:$PYTHON_VERSION
  script:
    - uv run pytest
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Code quality checks
lint:
  stage: test
  image: python:$PYTHON_VERSION
  script:
    - uv run ruff check src/
    - uv run black --check src/ tests/
    - uv run mypy src/

# Code Insight Analysis
analyze:
  stage: analyze
  image: python:$PYTHON_VERSION
  script:
    - uv run codeinsight analyze . --complexity --export json,html --export-dir ./reports
  artifacts:
    paths:
      - reports/
    expire_in: 1 week
  allow_failure: true

# Security audit
security:
  stage: analyze
  image: python:$PYTHON_VERSION
  script:
    - uv pip install safety
    - uv run safety check
  allow_failure: true

# Deploy to PyPI on tags
deploy:
  stage: deploy
  image: python:$PYTHON_VERSION
  script:
    - uv build
    - uv pip install twine
    - twine upload dist/*
  only:
    - tags
  environment:
    name: pypi