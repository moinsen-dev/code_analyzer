repos:
  - repo: local
    hooks:
      - id: black-check
        name: black-check
        entry: uv run black --check src/ tests/
        language: system
        types: [python]
        pass_filenames: false
      
      - id: isort-check
        name: isort-check
        entry: uv run isort --check-only src/ tests/
        language: system
        types: [python]
        pass_filenames: false
      
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check src/ tests/
        language: system
        types: [python]
        pass_filenames: false
      
      - id: mypy-check
        name: mypy-check
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
      
      - id: bandit-check
        name: bandit-check
        entry: uv run bandit -r src/ --severity-level high
        language: system
        types: [python]
        pass_filenames: false
      
      - id: vulture-check
        name: vulture-check
        entry: uv run vulture src/ vulture_whitelist.py
        language: system
        types: [python]
        pass_filenames: false
      
      - id: pip-audit-check
        name: pip-audit-check
        entry: uv run pip-audit
        language: system
        types: [python]
        pass_filenames: false
      
      - id: run-tests
        name: run-tests
        entry: uv run pytest tests/
        language: system
        types: [python]
        pass_filenames: false