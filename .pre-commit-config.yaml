repos:
  - repo: local
    hooks:
      - id: black-check
        name: black-check
        entry: uv run black --check src/ tests/
        language: system
        types: [python]
        pass_filenames: false
      
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check src/ tests/
        language: system
        types: [python]
        pass_filenames: false
      
      - id: mypy-check
        name: mypy-check
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
      
      - id: run-tests
        name: run-tests
        entry: uv run pytest tests/
        language: system
        types: [python]
        pass_filenames: false